<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="ceil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2a2a"/><stop offset="1" stop-color="#101010"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1c1c"/><stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="wallL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0c0c0c"/><stop offset="1" stop-color="#262626"/>
    </linearGradient>
    <linearGradient id="wallR" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#0c0c0c"/><stop offset="1" stop-color="#262626"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9b9b9"/><stop offset="0.08" stop-color="#9c9c9c"/><stop offset="1" stop-color="#5a5a5a"/>
    </linearGradient>
    <linearGradient id="panelDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a8a8a"/><stop offset="0.08" stop-color="#6f6f6f"/><stop offset="1" stop-color="#3a3a3a"/>
    </linearGradient>
    <linearGradient id="panelFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6a6a6a"/><stop offset="1" stop-color="#2e2e2e"/>
    </linearGradient>
    <linearGradient id="lamp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#c9c9c9"/>
    </linearGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.55" r="0.75">
      <stop offset="0.45" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.85"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.35" r="0.5">
      <stop offset="0" stop-color="#fff" stop-opacity="0.16"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.18"/></feComponentTransfer>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <rect width="1920" height="1000" fill="#121212"/>

  <!-- room shell: one point perspective, vanishing point 960,470 -->
  <polygon points="0,0 1920,0 1440,330 480,330" fill="url(#ceil)"/>
  <polygon points="480,330 1440,330 1440,640 480,640" fill="#1b1b1b"/>
  <polygon points="0,0 480,330 480,640 0,1000" fill="url(#wallL)"/>
  <polygon points="1920,0 1440,330 1440,640 1920,1000" fill="url(#wallR)"/>
  <polygon points="480,640 1440,640 1920,1000 0,1000" fill="url(#floor)"/>

  <!-- ceiling grid -->
  <g stroke="#3a3a3a" stroke-width="1.2" fill="none">
    <line x1="0" y1="0" x2="480" y2="330"/><line x1="240" y1="0" x2="600" y2="330"/><line x1="480" y1="0" x2="720" y2="330"/>
    <line x1="720" y1="0" x2="840" y2="330"/><line x1="960" y1="0" x2="960" y2="330"/><line x1="1200" y1="0" x2="1080" y2="330"/>
    <line x1="1440" y1="0" x2="1200" y2="330"/><line x1="1680" y1="0" x2="1320" y2="330"/><line x1="1920" y1="0" x2="1440" y2="330"/>
    <line x1="120" y1="80" x2="1800" y2="80"/><line x1="230" y1="160" x2="1690" y2="160"/><line x1="320" y1="220" x2="1600" y2="220"/>
    <line x1="390" y1="265" x2="1530" y2="265"/><line x1="440" y1="300" x2="1480" y2="300"/>
  </g>
  <!-- fluorescent panels -->
  <g fill="url(#lamp)" opacity="0.92">
    <polygon points="250,10 470,10 540,80 370,80"/>
    <polygon points="1450,10 1670,10 1550,80 1380,80"/>
    <polygon points="850,10 1070,10 1050,80 870,80"/>
    <polygon points="610,166 720,166 750,222 660,222"/>
    <polygon points="1200,166 1310,166 1260,222 1170,222"/>
    <polygon points="905,166 1015,166 1010,222 910,222"/>
    <polygon points="700,268 770,268 780,300 720,300"/><polygon points="1150,268 1220,268 1200,300 1140,300"/>
  </g>
  <g fill="#ffffff" opacity="0.35" filter="url(#soft)">
    <polygon points="250,10 470,10 540,80 370,80"/><polygon points="1450,10 1670,10 1550,80 1380,80"/><polygon points="850,10 1070,10 1050,80 870,80"/>
  </g>
  <!-- ceiling glow onto scene -->
  <rect width="1920" height="1000" fill="url(#glow)"/>

  <!-- far cubicle row along back wall -->
  <g>
    <rect x="490" y="500" width="150" height="140" fill="url(#panelFar)"/>
    <rect x="650" y="500" width="150" height="140" fill="url(#panelFar)"/>
    <rect x="1120" y="500" width="150" height="140" fill="url(#panelFar)"/>
    <rect x="1280" y="500" width="150" height="140" fill="url(#panelFar)"/>
    <rect x="860" y="520" width="200" height="120" fill="#3b3b3b"/>
    <rect x="900" y="470" width="120" height="80" fill="#0a0a0a"/>
  </g>

  <!-- left cubicle rows receding -->
  <g>
    <polygon points="0,560 150,590 150,920 0,1000" fill="url(#panelDark)"/>
    <polygon points="150,590 330,620 330,860 150,920" fill="url(#panel)"/>
    <polygon points="330,620 430,635 430,800 330,860" fill="url(#panelDark)"/>
    <polygon points="60,565 60,490 150,520 150,590" fill="#3c3c3c"/>
    <polygon points="200,598 200,530 330,560 330,620" fill="#454545"/>
  </g>
  <!-- right cubicle rows receding -->
  <g>
    <polygon points="1920,560 1770,590 1770,920 1920,1000" fill="url(#panelDark)"/>
    <polygon points="1770,590 1590,620 1590,860 1770,920" fill="url(#panel)"/>
    <polygon points="1590,620 1490,635 1490,800 1590,860" fill="url(#panelDark)"/>
    <polygon points="1860,565 1860,490 1770,520 1770,590" fill="#3c3c3c"/>
    <polygon points="1720,598 1720,530 1590,560 1590,620" fill="#454545"/>
  </g>

  <!-- central cubicle -->
  <g>
    <!-- back desk + monitor -->
    <rect x="780" y="620" width="360" height="12" fill="#8c8c8c"/>
    <rect x="780" y="632" width="360" height="40" fill="#2a2a2a"/>
    <rect x="905" y="520" width="110" height="90" fill="#0b0b0b" stroke="#444" stroke-width="3"/>
    <rect x="950" y="610" width="20" height="14" fill="#333"/>
    <!-- side panels (front) -->
    <polygon points="500,560 760,560 760,910 500,940" fill="url(#panel)"/>
    <polygon points="500,560 760,560 760,568 500,570" fill="#d2d2d2"/>
    <polygon points="1160,560 1420,560 1420,940 1160,910" fill="url(#panel)"/>
    <polygon points="1160,560 1420,560 1420,570 1160,568" fill="#d2d2d2"/>
    <rect x="500" y="930" width="260" height="14" fill="#2c2c2c"/>
    <rect x="1160" y="930" width="260" height="14" fill="#2c2c2c"/>
    <!-- fabric texture lines on panels -->
    <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="2">
      <line x1="520" y1="600" x2="520" y2="900"/><line x1="560" y1="600" x2="560" y2="900"/><line x1="600" y1="600" x2="600" y2="900"/><line x1="640" y1="600" x2="640" y2="900"/><line x1="680" y1="600" x2="680" y2="900"/><line x1="720" y1="600" x2="720" y2="900"/>
      <line x1="1200" y1="600" x2="1200" y2="900"/><line x1="1240" y1="600" x2="1240" y2="900"/><line x1="1280" y1="600" x2="1280" y2="900"/><line x1="1320" y1="600" x2="1320" y2="900"/><line x1="1360" y1="600" x2="1360" y2="900"/><line x1="1400" y1="600" x2="1400" y2="900"/>
    </g>
    <!-- office chair -->
    <g fill="#1d1d1d">
      <path d="M885 640 q75 -30 150 0 l-12 120 q-63 -18 -126 0 z" fill="#262626"/>
      <ellipse cx="960" cy="770" rx="82" ry="22" fill="#2e2e2e"/>
      <rect x="950" y="790" width="20" height="60" fill="#2a2a2a"/>
      <g stroke="#2a2a2a" stroke-width="10" stroke-linecap="round" fill="none">
        <line x1="960" y1="850" x2="880" y2="885"/><line x1="960" y1="850" x2="1040" y2="885"/><line x1="960" y1="850" x2="915" y2="905"/><line x1="960" y1="850" x2="1005" y2="905"/><line x1="960" y1="850" x2="960" y2="910"/>
      </g>
      <g fill="#3a3a3a"><circle cx="880" cy="887" r="8"/><circle cx="1040" cy="887" r="8"/><circle cx="915" cy="907" r="8"/><circle cx="1005" cy="907" r="8"/><circle cx="960" cy="912" r="8"/></g>
      <rect x="872" y="680" width="22" height="70" rx="6" fill="#222"/><rect x="1026" y="680" width="22" height="70" rx="6" fill="#222"/>
    </g>
  </g>

  <!-- floor light pools -->
  <ellipse cx="960" cy="860" rx="420" ry="90" fill="#fff" opacity="0.05" filter="url(#soft)"/>
  <ellipse cx="300" cy="760" rx="160" ry="50" fill="#fff" opacity="0.04" filter="url(#soft)"/>
  <ellipse cx="1620" cy="760" rx="160" ry="50" fill="#fff" opacity="0.04" filter="url(#soft)"/>

  <rect width="1920" height="1000" fill="url(#vignette)"/>
  <rect width="1920" height="1000" filter="url(#grain)" opacity="0.6"/>
</svg>
